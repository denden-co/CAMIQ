name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck, lint, test, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      # Build first: it generates the typed-route declarations that
      # typecheck needs. Must pass with NO env vars (clean checkout).
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run
      - run: npm audit --audit-level=high

  api:
    name: API (tests, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.lock.txt
      - run: pip install -r requirements.lock.txt pytest pip-audit
      - run: pytest
      - run: pip-audit -r requirements.lock.txt
